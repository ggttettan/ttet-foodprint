    <style>
        :root {
            --bg-dark: #121417; 
            --primary-accent: #d4af37; 
            --label-bg: rgba(18, 20, 23, 0.85); 
            --text-light: #f1f1f1;
            --text-muted: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; 
        }
        
        #map {
            height: 100vh;
            width: 100%;
            background-color: var(--bg-dark); 
        }

        /* --- FANCY MINIMALIST OVERLAY --- */
        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000; 
            padding: 15px 25px;
            pointer-events: none; 
        }
        
        .title-overlay h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            color: var(--primary-accent);
            letter-spacing: 1px;
            line-height: 1.1;
            text-transform: lowercase; 
        }
        
        .title-overlay p {
            margin: 8px 0 0 5px;
            font-size: 0.75rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* --- REFINED POPUPS --- */
        .leaflet-popup-content-wrapper {
            background-color: #1a1d21; 
            color: var(--text-light);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3); 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        
        .leaflet-popup-content {
            margin: 10px 14px;
            font-weight: 300;
            line-height: 1.6;
        }

        .leaflet-popup-content h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--primary-accent);
            margin: 0 0 6px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 4px;
        }
        
        .leaflet-popup-content p {
            font-size: 0.8rem;
            color: var(--text-light);
            margin: 0;
        }

        .leaflet-popup-tip {
            background-color: #1a1d21;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: none;
            border-left: none;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #777;
            padding: 10px 8px 0 0;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: var(--primary-accent);
        }

        /* --- FANCY DIVICON PIN (Fancy Gold Dot) --- */
        .fancy-dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary-accent);
            border: 2px solid var(--text-light);
            border-radius: 50%;
            display: block;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            position: absolute;
            transform: translate(-50%, -50%); 
        }
        
        .fancy-dot::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            background-color: var(--primary-accent);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            animation: pulse 1.8s infinite;
            opacity: 0.6;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
        }

        /* --- FANCY PINNED NAME PREVIEW (PERMANENT TOOLTIP) --- */
        .leaflet-tooltip-pane {
            z-index: 999; 
        }
        
        .leaflet-tooltip.fancy-label {
            background-color: var(--label-bg);
            color: var(--text-light);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 3px;
            padding: 3px 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px); 
            
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }
        
        .leaflet-tooltip-top.fancy-label::before {
            border-top-color: rgba(212, 175, 55, 0.4);
        }
        
        .leaflet-tooltip.fancy-label.faded {
            opacity: 0.1; 
        }

        .leaflet-control-attribution {
            background: rgba(18, 20, 23, 0.72) !important;
            color: #a0a0a0;
            font-size: 9px;
            backdrop-filter: blur(2px);
        }

        .leaflet-control-attribution a {
            color: #c9b15a;
        }

        .noscript-message {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg-dark);
            color: var(--text-light);
            text-align: center;
        }

        @media (max-width: 600px) {
            .title-overlay {
                top: 10px;
                left: 10px;
                padding: 10px 14px;
            }

            .title-overlay h1 {
                font-size: 2rem;
            }

            .title-overlay p {
                margin-top: 5px;
                margin-left: 3px;
                font-size: 0.62rem;
                letter-spacing: 1.8px;
            }

            .leaflet-popup-content {
                margin: 8px 10px;
            }

            .leaflet-popup-content h3 {
                font-size: 1.3rem;
            }

            .leaflet-popup-content p {
                font-size: 0.75rem;
            }

            .leaflet-tooltip.fancy-label {
                font-size: 8px;
                padding: 2px 5px;
                letter-spacing: 0.9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fancy-dot::after {
                animation: none;
            }

            .leaflet-tooltip.fancy-label {
                transition: none;
            }
        }

    </style>
</head>

        var fancyDotIcon = L.divIcon({

                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            };

            var popupContent = "<h3>" + escapeHtml(loc.name) + ", " + escapeHtml(loc.country) + "</h3>" +

            marker.bindPopup(popupContent);
            
            var label = loc.name;
            var tooltip = marker.bindTooltip(label, {
                permanent: true,
                direction: 'top',
                className: 'fancy-label', 
                offset: [0, -14] 
            });
            
            tooltips.push(tooltip.getTooltip());
        });

        map.on('zoomstart movestart', function() {
            tooltips.forEach(function(t) {
                if (t.getElement()) t.getElement().classList.add('faded');
            });
        });
        
        map.on('zoomend moveend', function() {
            tooltips.forEach(function(t) {
                if (t.getElement()) t.getElement().classList.remove('faded');
            });
        });

    </script>
</body>
</html>
