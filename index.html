<style>
    :root {
        --bg-dark: #121417;
        --panel-dark: #1a1d21;
        --primary-accent: #d4af37;
        --accent-soft: rgba(212, 175, 55, 0.4);
        --label-bg: rgba(18, 20, 23, 0.85);
        --text-light: #f1f1f1;
        --text-muted: #a0a0a0;
        --shadow: rgba(0, 0, 0, 0.6);
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--bg-dark);
        color: var(--text-light);
        font-family: 'Montserrat', sans-serif;
        overflow: hidden;
    }

    body {
        overscroll-behavior: none;
    }

    /* =========================
       MAP
       ========================= */

    #map {
        width: 100%;
        height: 100dvh;
        min-height: 100vh;
        background: var(--bg-dark);
    }

    /* =========================
       TITLE
       ========================= */

    .title-overlay {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        padding: 15px 25px;
        pointer-events: none;
        user-select: none;
    }

    .title-overlay h1 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 4vw, 2.8rem);
        font-weight: 400;
        color: var(--primary-accent);
        letter-spacing: 1px;
        line-height: 1.05;
        text-transform: lowercase;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .title-overlay p {
        margin: 8px 0 0 5px;
        font-size: 0.75rem;
        font-weight: 300;
        color: var(--text-muted);
        letter-spacing: 2.5px;
        text-transform: uppercase;
    }

    /* =========================
       CUSTOM MARKER
       ========================= */

    .custom-div-icon {
        background: transparent;
        border: none;
    }

    .fancy-dot {
        width: 12px;
        height: 12px;
        position: absolute;
        top: 0;
        left: 0;

        display: block;

        background-color: var(--primary-accent);
        border: 2px solid var(--text-light);
        border-radius: 50%;

        transform: translate(-50%, -50%);

        box-shadow:
            0 0 10px rgba(212, 175, 55, 0.8),
            0 0 20px rgba(212, 175, 55, 0.25);
    }

    .fancy-dot::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;

        width: 100%;
        height: 100%;

        background-color: var(--primary-accent);
        border-radius: 50%;

        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;

        animation: pulse 1.8s ease-out infinite;
        pointer-events: none;
    }

    @keyframes pulse {
        0% {
            transform: translate(-50%, -50%) scale(1);
            opacity: 0.6;
        }

        100% {
            transform: translate(-50%, -50%) scale(3.5);
            opacity: 0;
        }
    }

    /* =========================
       PERMANENT LOCATION LABELS
       ========================= */

    .leaflet-tooltip-pane {
        z-index: 999;
    }

    .leaflet-tooltip.fancy-label {
        background: var(--label-bg);
        color: var(--text-light);

        border: 1px solid var(--accent-soft);
        border-radius: 3px;

        padding: 3px 6px;

        box-shadow: 0 4px 10px var(--shadow);

        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);

        font-family: 'Montserrat', sans-serif;
        font-size: 9px;
        font-weight: 300;

        text-transform: uppercase;
        letter-spacing: 1.2px;

        opacity: 0.85;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease;

        white-space: nowrap;
        pointer-events: none;
    }

    .leaflet-tooltip-top.fancy-label::before {
        border-top-color: var(--accent-soft);
    }

    .leaflet-tooltip.fancy-label.faded {
        opacity: 0.08;
    }

    /* =========================
       POPUPS
       ========================= */

    .leaflet-popup-content-wrapper {
        background: var(--panel-dark);
        color: var(--text-light);

        border-radius: 8px;
        padding: 8px;

        border: 1px solid rgba(212, 175, 55, 0.3);

        box-shadow: 0 8px 24px var(--shadow);
    }

    .leaflet-popup-content {
        margin: 10px 14px;

        font-weight: 300;
        line-height: 1.6;

        min-width: 180px;
        max-width: 280px;
    }

    .leaflet-popup-content h3 {
        margin: 0 0 6px;

        padding-bottom: 5px;

        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        font-weight: 600;

        color: var(--primary-accent);

        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .leaflet-popup-content p {
        margin: 0;

        color: var(--text-light);
        font-size: 0.8rem;
        font-weight: 300;
    }

    .leaflet-popup-tip {
        background: var(--panel-dark);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-top: none;
        border-left: none;
    }

    .leaflet-container a.leaflet-popup-close-button {
        color: #777;
        padding: 10px 8px 0 0;
        transition: color 0.2s ease;
    }

    .leaflet-container a.leaflet-popup-close-button:hover,
    .leaflet-container a.leaflet-popup-close-button:focus {
        color: var(--primary-accent);
    }

    /* =========================
       LEAFLET CONTROLS
       ========================= */

    .leaflet-control-zoom {
        border: none !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45) !important;
    }

    .leaflet-control-zoom a {
        width: 32px !important;
        height: 32px !important;
        line-height: 30px !important;

        background: rgba(18, 20, 23, 0.88) !important;
        color: var(--text-muted) !important;

        border: 1px solid rgba(212, 175, 55, 0.2) !important;

        transition:
            color 0.2s ease,
            background 0.2s ease;
    }

    .leaflet-control-zoom a:hover,
    .leaflet-control-zoom a:focus {
        background: rgba(26, 29, 33, 0.95) !important;
        color: var(--primary-accent) !important;
    }

    .leaflet-control-attribution {
        background: rgba(18, 20, 23, 0.72) !important;
        color: var(--text-muted) !important;

        font-size: 9px;

        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
    }

    .leaflet-control-attribution a {
        color: #c9b15a !important;
    }

    /* =========================
       NOSCRIPT
       ========================= */

    .noscript-message {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: grid;
        place-items: center;

        padding: 24px;

        background: var(--bg-dark);
        color: var(--text-light);

        text-align: center;

        font-family: 'Montserrat', sans-serif;
        font-size: 0.9rem;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
        .title-overlay {
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            padding: 10px 14px;
        }

        .title-overlay h1 {
            font-size: 2rem;
        }

        .title-overlay p {
            margin-top: 5px;
            margin-left: 3px;

            font-size: 0.62rem;
            letter-spacing: 1.8px;
        }

        .leaflet-popup-content {
            margin: 8px 10px;
            min-width: 160px;
        }

        .leaflet-popup-content h3 {
            font-size: 1.3rem;
        }

        .leaflet-popup-content p {
            font-size: 0.75rem;
        }

        .leaflet-tooltip.fancy-label {
            padding: 2px 5px;
            font-size: 8px;
            letter-spacing: 0.9px;
        }

        .leaflet-control-zoom {
            margin-right: 10px !important;
            margin-bottom: 10px !important;
        }

        .leaflet-control-attribution {
            font-size: 8px;
        }
    }

    /* =========================
       REDUCED MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {
        .fancy-dot::after {
            animation: none;
        }

        .leaflet-tooltip.fancy-label {
            transition: none;
        }
    }
</style>

    /* =========================================================
       HELPERS
       ========================================================= */

    /**
     * Escape user/data-provided strings before inserting them
     * into HTML.
     */
    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    /**
     * Create popup HTML for a location.
     */
    function createPopupContent(location) {
        const name = escapeHtml(location.name);
        const country = escapeHtml(location.country);
        const details = escapeHtml(location.details);

        return `
            <div class="location-popup">
                <h3>${name}, ${country}</h3>
                <p>${details}</p>
            </div>
        `;
    }


    /* =========================================================
       CUSTOM ICON
       ========================================================= */

    const fancyDotIcon = L.divIcon({
        className: 'custom-div-icon',
        html: '<div class="fancy-dot" aria-hidden="true"></div>',
        iconSize: [12, 12],
        iconAnchor: [6, 6],
        popupAnchor: [0, -10],
        tooltipAnchor: [0, -14]
    });


    /* =========================================================
       CREATE MARKERS
       ========================================================= */

    const tooltips = [];
    const markers = [];

    locations.forEach((location) => {

        const marker = L.marker(
            location.coords,
            {
                icon: fancyDotIcon,
                keyboard: true,
                title: `${location.name}, ${location.country}`,
                alt: `${location.name}, ${location.country}`
            }
        ).addTo(map);

        /* Popup */
        marker.bindPopup(
            createPopupContent(location),
            {
                closeButton: true,
                autoPan: true,
                autoPanPadding: [30, 30],
                maxWidth: 300
            }
        );

        /* Permanent location label */
        marker.bindTooltip(
            escapeHtml(location.name),
            {
                permanent: true,
                direction: 'top',
                className: 'fancy-label',
                offset: [0, -14],
                opacity: 0.85
            }
        );

        markers.push(marker);
        tooltips.push(marker.getTooltip());
    });


    /* =========================================================
       FADE LABELS DURING MAP MOVEMENT
       ========================================================= */

    function fadeLabels() {
        tooltips.forEach((tooltip) => {
            const element = tooltip.getElement();

            if (element) {
                element.classList.add('faded');
            }
        });
    }


    function restoreLabels() {
        window.requestAnimationFrame(() => {
            tooltips.forEach((tooltip) => {
                const element = tooltip.getElement();

                if (element) {
                    element.classList.remove('faded');
                }
            });
        });
    }


    map.on('zoomstart movestart', fadeLabels);
    map.on('zoomend moveend', restoreLabels);


    /* =========================================================
       HANDLE RESIZE
       ========================================================= */

    let resizeTimer;

    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            map.invalidateSize();
        }, 150);
    });


    /* =========================================================
       HANDLE DEVICE ORIENTATION
       ========================================================= */

    window.addEventListener('orientationchange', () => {
        setTimeout(() => {
            map.invalidateSize();
        }, 300);
    });


    /* =========================================================
       INITIAL MAP REFRESH
       ========================================================= */

    window.addEventListener('load', () => {
        map.invalidateSize();
    });

</script>
